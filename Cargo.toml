[package]
name = "watch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A command-line tool to browse and watch anime"
license = "GPL-3.0-only"
repository = "https://github.com/gabrielfranicevich/watch"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.22"
base64 = "0.22"
serde_json = "1"

[lib]
name = "ani_cli"
path = "src/lib.rs"

[[bin]]
name = "watch"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
