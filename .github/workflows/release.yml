name: Release binaries

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "watch"))')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build release binary
        run: cargo build --locked --release --bin watch --target ${{ matrix.target }}

      - name: Stage release files
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/stage
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/watch.exe" dist/stage/watch.exe
          else
            cp "target/$TARGET/release/watch" dist/stage/watch
          fi
          cp LICENSE README.md watch.1 dist/stage/

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "watch" | Select-Object -ExpandProperty version
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/watch-$version-$env:TARGET.zip"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "watch"))')"
          tar -czf "dist/watch-$version-$TARGET.tar.gz" -C dist/stage .

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: watch-${{ matrix.target }}
          path: dist/watch-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: watch-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum watch-* > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/watch-*
            dist/SHA256SUMS
