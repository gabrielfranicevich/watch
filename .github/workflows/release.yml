name: Release binaries

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "watch"))')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build release binary
        run: cargo build --locked --release --bin watch --target ${{ matrix.target }}

      - name: Stage release files
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/stage
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/watch.exe" dist/stage/watch.exe
          else
            cp "target/$TARGET/release/watch" dist/stage/watch
          fi
          cp LICENSE README.md watch.1 dist/stage/

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "watch" | Select-Object -ExpandProperty version
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/watch-$version-$env:TARGET.zip"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "watch"))')"
          tar -czf "dist/watch-$version-$TARGET.tar.gz" -C dist/stage .

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: watch-${{ matrix.target }}
          path: dist/watch-*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android x86_64-linux-android

      - name: Configure Android NDK toolchains
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$TOOLCHAIN/x86_64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build native Android application
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage Android APK
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "watch"))')"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/watch-$version-android-universal-debug.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-android
          path: dist/watch-*-android-*.apk
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: Wait for required CI workflows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for Rust and Markdown checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-ci.sh

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    needs:
      - build
      - android
      - ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository for the rolling development tag
        if: github.ref == 'refs/heads/develop'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Move rolling development tag
        if: github.ref == 'refs/heads/develop'
        run: |
          git tag --force develop "$GITHUB_SHA"
          git push --force origin refs/tags/develop

      - name: Download platform archives and Android APK
        uses: actions/download-artifact@v4
        with:
          pattern: watch-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum watch-* > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref == 'refs/heads/develop' && 'develop' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/develop' && 'Watch Development' || format('Watch {0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
          overwrite_files: true
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/watch-*
            dist/SHA256SUMS
