name: 'markdown checks'
on:
  push:
    branches:
      - main
      - develop
      - android-support
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
      - android-support
    paths:
      - "**.md"

permissions:
  contents: read

jobs:
  dead-links:
    name: Dead Link Checker
    runs-on: ubuntu-latest
    steps:
    - name: Run DeadFinder
      uses: hahwul/deadfinder@1.2.4
      id: broken-link
      with:
        command: file
        target: "**.md"
  trailing-ws:
    name: Find Trailing Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocular-d/trailing-spaces@0.0.2

  markdown-layout:
    name: Markdown layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep Markdown documentation under docs
        shell: bash
        run: |
          test -f README.md
          test -f docs/tutorial.md
          unexpected="$(find . -type f -name '*.md' ! -path './README.md' ! -path './docs/*' ! -path './.git/*' -print)"
          if [ -n "$unexpected" ]; then
            printf 'Markdown files must live under docs/ (except README.md):\n%s\n' "$unexpected"
            exit 1
          fi
